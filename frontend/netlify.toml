[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[dev]
  command = "npm start"
  port = 3000
  targetPort = 3000
  publish = "public"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
