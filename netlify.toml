[build]
  base = "frontend"
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[context.production]
  environment = { NODE_VERSION = "20", SECRETS_SCAN_SMART_DETECTION_ENABLED = "false" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
